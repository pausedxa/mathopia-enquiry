<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join Mathopia</title>
<base target="_top">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Luckiest+Guy&display=swap" rel="stylesheet">
<style>
  :root {
    /* from the Mathopia logo */
    --navy: #1d6f86;
    --ink: #1f2b1a;
    --gold: #7cb956;
    --gold-dark: #5a9439;
    --coral: #d9533f;
    --leaf-dark: #3f5130;
    --paper: #f7faf3;
    --cream: #dce9cf;
    --line: rgba(31, 43, 26, 0.14);
    --muted: rgba(31, 43, 26, 0.62);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 16px/1.5 Inter, system-ui, -apple-system, sans-serif;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 32px 16px 64px; }
  header { margin-bottom: 28px; }
  .logo { display: block; width: 100%; height: auto; border-radius: 18px; }
  h1 { font-family: "Luckiest Guy", cursive; font-weight: 400; font-size: clamp(34px, 8vw, 48px); line-height: 1.05; margin: 14px 0 10px; color: var(--navy); }
  .lede { margin: 0; color: var(--muted); }

  fieldset { border: 0; margin: 0 0 18px; padding: 20px; background: #fff; border: 1px solid var(--line); border-radius: 18px; }
  legend { float: left; width: 100%; padding: 0; margin-bottom: 14px; font-weight: 600; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--navy); }
  legend + * { clear: both; }
  .grid { display: grid; gap: 14px; }
  @media (min-width: 560px) { .two { grid-template-columns: 1fr 1fr; } }

  label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 6px; }
  .req { color: var(--coral); }
  .hint { font-weight: 400; color: var(--muted); }
  input[type=text], input[type=tel], input[type=email], select, textarea {
    width: 100%; font: inherit; color: inherit; background: var(--paper);
    border: 1.5px solid var(--line); border-radius: 12px; padding: 11px 13px;
  }
  textarea { min-height: 96px; resize: vertical; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--navy); background: #fff; }
  input[aria-invalid=true], .choices[aria-invalid=true] { border-color: var(--coral); }

  .choices { display: flex; flex-wrap: wrap; gap: 8px; border: 1.5px solid transparent; border-radius: 14px; }
  .choices input { position: absolute; opacity: 0; pointer-events: none; }
  .choices label {
    margin: 0; cursor: pointer; padding: 9px 15px; border-radius: 999px;
    border: 1.5px solid var(--line); background: var(--paper); font-weight: 500; font-size: 15px;
    user-select: none; transition: background .12s, border-color .12s;
  }
  .choices input:checked + label { background: var(--navy); border-color: var(--navy); color: #fff; }
  .choices input:focus-visible + label { outline: 2px solid var(--gold-dark); outline-offset: 2px; }
  .mode label { flex: 1 1 140px; text-align: center; padding: 12px 15px; }

  .hp { position: absolute; left: -9999px; }
  .err { color: var(--coral); font-size: 14px; margin: 0 0 14px; min-height: 1em; }
  button {
    width: 100%; font: 600 17px Inter, sans-serif; color: #fff; cursor: pointer;
    background: var(--gold); border: 0; border-radius: 14px; padding: 15px 20px;
    box-shadow: 0 4px 0 var(--gold-dark);
  }
  button:hover { filter: brightness(1.03); }
  button:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--gold-dark); }
  button[disabled] { opacity: .6; cursor: progress; }

  .done { display: none; text-align: center; padding: 48px 20px; background: #fff; border: 1px solid var(--line); border-radius: 18px; }
  .done .tick { width: 64px; height: 64px; margin: 0 auto 16px; border-radius: 50%; background: var(--leaf-dark); color: #fff; display: grid; place-items: center; font-size: 34px; }
  .done h2 { font-family: "Luckiest Guy", cursive; font-weight: 400; font-size: 32px; margin: 0 0 8px; color: var(--navy); }
  .done p { margin: 0; color: var(--muted); }
  .sent form { display: none; }
  .sent .done { display: block; }
</style>
</head>

igAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACtjw9/yHdP8A+vqL/wBDFY9bHh7/AJDun/8AX1F/6GK1o/xI+qLh8SP/2Q==">
    <h1>Join Mathopia</h1>
    <p class="lede">Tell us a little about your child and we'll get back to you about classes, online or offline.</p>
  </header>

  <form id="form" novalidate>
    <fieldset>
      <legend>Student</legend>
      <div class="grid">
        <div>
          <label for="studentName">Student's name <span class="req">*</span></label>
          <input type="text" id="studentName" name="studentName" autocomplete="off" required>
        </div>
        <div class="grid two">
          <div>
            <label for="grade">Grade / standard</label>
            <select id="grade" name="grade">
              <option value="">Choose…</option>
              <option>1</option><option>2</option><option>3</option><option>4</option>
              <option>5</option><option>6</option><option>7</option><option>8</option>
              <option>9</option><option>10</option><option>11</option><option>12</option>
              <option>Other</option>
            </select>
          </div>
          <div>
            <label for="board">Board</label>
            <select id="board" name="board">
              <option value="">Choose…</option>
              <option>CBSE</option><option>ICSE</option><option>IGCSE</option>
              <option>IB</option><option>State board</option><option>Other</option>
            </select>
          </div>
        </div>
        <div class="grid two">
          <div>
            <label for="school">School</label>
            <input type="text" id="school" name="school">
          </div>
          <div>
            <label for="schoolTiming">School timing</label>
            <input type="text" id="schoolTiming" name="schoolTiming" placeholder="e.g. 8 am to 2:30 pm">
          </div>
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Parent or guardian</legend>
      <div class="grid">
        <div>
          <label for="parentName">Your name <span class="req">*</span></label>
          <input type="text" id="parentName" name="parentName" autocomplete="name" required>
        </div>
        <div class="grid two">
          <div>
            <label for="phone">Phone / WhatsApp <span class="req">*</span></label>
            <input type="tel" id="phone" name="phone" autocomplete="tel" inputmode="tel" required>
          </div>
          <div>
            <label for="email">Email <span class="hint">(optional)</span></label>
            <input type="email" id="email" name="email" autocomplete="email">
          </div>
        </div>
        <div>
          <label for="city">City / area</label>
          <input type="text" id="city" name="city" autocomplete="address-level2">
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Classes</legend>
      <div class="grid">
        <div>
          <label id="modeLabel">Online or offline? <span class="req">*</span></label>
          <div class="choices mode" role="radiogroup" aria-labelledby="modeLabel" id="mode">
            <input type="radio" name="mode" id="m-online" value="Online"><label for="m-online">Online</label>
            <input type="radio" name="mode" id="m-offline" value="Offline"><label for="m-offline">Offline</label>
            <input type="radio" name="mode" id="m-either" value="Either is fine"><label for="m-either">Either is fine</label>
          </div>
        </div>
        <div>
          <label id="lookingLabel">Looking for <span class="hint">(pick any)</span></label>
          <div class="choices" aria-labelledby="lookingLabel">
            <input type="checkbox" name="lookingFor" id="l-foundation" value="Foundational maths"><label for="l-foundation">Foundational maths</label>
            <input type="checkbox" name="lookingFor" id="l-competitive" value="Competitive exams (IPM and others)"><label for="l-competitive">Competitive exams (IPM and others)</label>
            <input type="checkbox" name="lookingFor" id="l-school" value="School maths"><label for="l-school">School maths</label>
            <input type="checkbox" name="lookingFor" id="l-higher" value="Higher-level maths than school"><label for="l-higher">Higher-level maths than school</label>
          </div>
        </div>
        <div>
          <label id="daysLabel">Preferred days</label>
          <div class="choices" aria-labelledby="daysLabel">
            <input type="checkbox" name="days" id="d-mon" value="Mon"><label for="d-mon">Mon</label>
            <input type="checkbox" name="days" id="d-tue" value="Tue"><label for="d-tue">Tue</label>
            <input type="checkbox" name="days" id="d-wed" value="Wed"><label for="d-wed">Wed</label>
            <input type="checkbox" name="days" id="d-thu" value="Thu"><label for="d-thu">Thu</label>
            <input type="checkbox" name="days" id="d-fri" value="Fri"><label for="d-fri">Fri</label>
            <input type="checkbox" name="days" id="d-sat" value="Sat"><label for="d-sat">Sat</label>
            <input type="checkbox" name="days" id="d-sun" value="Sun"><label for="d-sun">Sun</label>
          </div>
        </div>
        <div>
          <label for="time">Preferred time</label>
          <input type="text" id="time" name="time" placeholder="e.g. after 4 pm">
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Anything else</legend>
      <div class="grid">
        <div>
          <label for="source">How did you hear about us?</label>
          <select id="source" name="source">
            <option value="">Choose…</option>
            <option>Friend or family</option><option>Another Mathopia parent</option>
            <option>School</option><option>Instagram</option><option>Google</option><option>Other</option>
          </select>
        </div>
        <div>
          <label for="message">Message <span class="hint">(optional)</span></label>
          <textarea id="message" name="message" placeholder="Anything we should know: topics your child finds hard, exams coming up, questions for us…"></textarea>
        </div>
      </div>
    </fieldset>

    <input type="text" name="website" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
    <p class="err" id="err" role="alert"></p>
    <button type="submit" id="submit">Send enquiry</button>
  </form>

  <div class="done" role="status">
    <div class="tick">✓</div>
    <h2>Thank you!</h2>
    <p>We've got your enquiry and will be in touch on WhatsApp or by phone soon.</p>
  </div>
</div>

<script>
  var form = document.getElementById('form');
  var err = document.getElementById('err');
  var btn = document.getElementById('submit');

  function values(name) {
    return Array.prototype.map.call(form.querySelectorAll('input[name="' + name + '"]:checked'), function (i) { return i.value; }).join(', ');
  }

  function mark(el, bad) { el.setAttribute('aria-invalid', bad ? 'true' : 'false'); return bad; }

  form.addEventListener('input', function (e) { if (e.target.getAttribute('aria-invalid') === 'true') mark(e.target, false); });
  form.addEventListener('change', function (e) { if (e.target.name === 'mode') mark(document.getElementById('mode'), false); });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var f = {
      studentName: form.studentName.value, grade: form.grade.value, board: form.board.value, school: form.school.value,
      schoolTiming: form.schoolTiming.value,
      parentName: form.parentName.value, phone: form.phone.value, email: form.email.value, city: form.city.value,
      mode: values('mode'), lookingFor: values('lookingFor'), days: values('days'), time: form.time.value,
      source: form.source.value, message: form.message.value, website: form.website.value
    };
    var missing = [
      mark(form.studentName, !f.studentName.trim()),
      mark(form.parentName, !f.parentName.trim()),
      mark(form.phone, f.phone.replace(/\D/g, '').length < 8),
      mark(document.getElementById('mode'), !f.mode)
    ].some(Boolean);
    if (missing) {
      err.textContent = 'Please fill in the fields marked in red.';
      var first = form.querySelector('[aria-invalid=true]');
      if (first) first.scrollIntoView({ behavior: 'smooth', block: 'center' });
      return;
    }
    err.textContent = '';
    btn.disabled = true;
    btn.textContent = 'Sending…';
    // text/plain keeps this a simple request, so the browser sends no preflight
    fetch('https://script.google.com/macros/s/AKfycbwMy5tLxgPnKNDTSRrwBeD2zvGDiTlKKb4bnhyw2pVPI5h5u_xWUPFIgyxddmdbdNd-QQ/exec', { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(f) })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        if (!res.ok) throw new Error(res.error);
        document.getElementById('app').classList.add('sent');
        window.scrollTo(0, 0);
      })
      .catch(function () {
        btn.disabled = false;
        btn.textContent = 'Send enquiry';
        err.textContent = "Sorry, that didn't go through. Please try again, or message us on WhatsApp.";
      });
  });
</script>
</body>
</html>
